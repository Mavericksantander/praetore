name: Assurance gates

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  rust:
    name: Rust tests, lint, and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo test --workspace --locked
      - run: cargo run --locked --package praetore-core --example high_assurance
      - name: Receipt verification demo (DEMO/TEST-ONLY keys)
        run: ./demo/verify-receipt.sh
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --all -- --check
      - name: Validate Kubernetes manifest YAML syntax
        run: |
          ruby -e 'require "yaml"; Dir.glob("deploy/kubernetes/**/*.yaml").each { |path| YAML.load_stream(File.read(path)); puts "valid YAML: #{path}" }'
      - name: Check changed patch whitespace
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        run: git diff --check ${{ github.event.pull_request.base.sha || github.event.before }}...HEAD

  hook-evidence:
    name: Claude Code hook evidence (sets 03, 04, 05)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # verify.sh exits non-zero if any receipt fails, if a policy digest does
      # not match, or if a one-byte tampered copy is accepted.
      - name: Verify set 03
        run: ./examples/claude-code-hook/verify.sh examples/claude-code-hook/evidence/03-bundle-demo-reproducible
      - name: Verify set 04
        run: ./examples/claude-code-hook/verify.sh examples/claude-code-hook/evidence/04-sesion-real-bloqueada-web-fetch
      - name: Verify set 05
        run: ./examples/claude-code-hook/verify.sh examples/claude-code-hook/evidence/05-sesion-real-final

  journal-chain:
    name: Journal chains (sets 03, 04, 05) and tampered copies
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The expected heads are pinned here, separately from the chain files, so
    # a change to a chain file alone fails this job. They live in the same
    # repository, so this is not an external anchor (see VERIFY.md).
    env:
      HEAD_03: 4cea4fe91378a8471368b755e9bbdd23092e76a9d39517cc8e2cb393f83da90a
      HEAD_04: f1666f5447351b18896792e64c7994d27561896beca37ec695571b73882d5af0
      HEAD_05: 79a5374eaa24f8bc79d3c3818fbb2624154d93607e3ed3ee6434bef43ae146c9
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # verify-chain.sh exits non-zero if the chain or its head does not
      # verify, if re-exporting does not reproduce it byte for byte, or if any
      # tampered copy (deleted receipt, deleted and re-linked, truncated,
      # reordered, altered byte) is accepted.
      - name: Chain of set 03
        run: ./examples/claude-code-hook/verify-chain.sh examples/claude-code-hook/evidence/03-bundle-demo-reproducible "$HEAD_03"
      - name: Chain of set 04
        run: ./examples/claude-code-hook/verify-chain.sh examples/claude-code-hook/evidence/04-sesion-real-bloqueada-web-fetch "$HEAD_04"
      - name: Chain of set 05
        run: ./examples/claude-code-hook/verify-chain.sh examples/claude-code-hook/evidence/05-sesion-real-final "$HEAD_05"
      - name: A wrong expected head is rejected
        run: |
          if ./examples/claude-code-hook/verify-chain.sh examples/claude-code-hook/evidence/04-sesion-real-bloqueada-web-fetch "$HEAD_05"; then
            echo "::error::set 04 verified against the head of set 05"; exit 1
          fi

  macos:
    name: macOS workspace link
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --workspace --locked
      - run: cargo test -p praetore-python --locked

  verifier-features:
    name: Offline verifiers build without receipt signing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # `ExecutionAttestation::create` exists only with praetore-receipt's
      # `signing` feature. Workspace-wide commands unify features (the gateway
      # enables `signing`), so they cannot catch a verifier that starts
      # enabling it. Resolve each verifier on its own, over its shipped
      # (normal + build) dependency graph, with default and with all features,
      # and fail if `signing` appears.
      - name: praetore-verify and praetore-python do not enable signing
        run: |
          set -euo pipefail
          for package in praetore-verify praetore-python; do
            # Default features, then every optional feature of the package.
            for features in "" "--all-features"; do
              tree="$(cargo tree --locked -p "$package" $features --edges normal,build,features -i praetore-receipt)"
              printf '%s\n' "$tree"
              if grep -F 'praetore-receipt feature "signing"' <<<"$tree"; then
                echo "::error::$package ${features:-(default features)} enables praetore-receipt/signing"
                exit 1
              fi
            done
          done
      # Sanity check that the guard can fail: the gateway must enable it.
      - name: praetore-gateway does enable signing
        run: |
          set -euo pipefail
          for features in "" "--all-features"; do
            cargo tree --locked -p praetore-gateway $features --edges normal,build,features -i praetore-receipt | grep -F 'praetore-receipt feature "signing"'
          done
      - run: cargo check --locked -p praetore-verify
      - run: cargo check --locked -p praetore-python
      - run: cargo check --locked -p praetore-receipt --no-default-features

  audit:
    name: Dependency advisory audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit
      - run: cargo audit --file fuzz/Cargo.lock

  fuzz-smoke:
    name: Fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - run: cargo +nightly install cargo-fuzz --locked
      - run: cargo +nightly check --manifest-path fuzz/Cargo.toml --locked
      - run: UPDATE_FUZZ_CORPUS=1 cargo test -p praetore-verify --test verify_cli evidence_command_verifies_trusted_signature_intent_and_authority --locked
      - run: cargo +nightly fuzz run --fuzz-dir fuzz canonical_json -- -max_total_time=10
      - run: cargo +nightly fuzz run --fuzz-dir fuzz policy_parse -- -max_total_time=10
      - run: cargo +nightly fuzz run --fuzz-dir fuzz authority_verify -- -max_total_time=10
      - run: cargo +nightly fuzz run --fuzz-dir fuzz evidence_verify -- -max_total_time=10
      - run: cargo +nightly fuzz run --fuzz-dir fuzz engine_evaluate_dev -- -max_total_time=10
      - run: cargo +nightly fuzz run --fuzz-dir fuzz engine_evaluate_high_assurance -- -max_total_time=10
      - run: cargo +nightly fuzz run --fuzz-dir fuzz path_prefix -- -max_total_time=10

  python-verify:
    name: Python evidence verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: UPDATE_PYTHON_FIXTURE=1 cargo test -p praetore-verify --test verify_cli evidence_command_verifies_trusted_signature_intent_and_authority --locked
      - run: python -m pip install ./packages/praetore-python
      - run: python -m unittest discover -s packages/praetore-python/tests -v
      - run: ./examples/third-party-verification/verify.sh

  claude-code-hook-example:
    name: Claude Code hook example (standalone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # Not a workspace member: it has its own manifest and lockfile.
      - run: cargo fmt --manifest-path examples/claude-code-hook/Cargo.toml -- --check
      - run: cargo clippy --manifest-path examples/claude-code-hook/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path examples/claude-code-hook/Cargo.toml --locked
      - name: Verify the committed bundle with praetore-verify only
        run: ./examples/claude-code-hook/verify.sh
      - name: Regenerate a bundle and verify it
        run: |
          ./examples/claude-code-hook/demo.sh "$RUNNER_TEMP/claude-code-hook-bundle"
          ./examples/claude-code-hook/verify.sh "$RUNNER_TEMP/claude-code-hook-bundle"

  replay-postgres:
    name: PostgreSQL replay guard integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: praetore
          POSTGRES_PASSWORD: praetore-test
          POSTGRES_DB: praetore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U praetore -d praetore_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PRAETORE_TEST_DATABASE_URL: postgres://praetore:praetore-test@localhost:5432/praetore_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p praetore-replay-postgres --locked
      - run: cargo test -p praetore-cli --locked -- --ignored --exact journal_export::tests::postgres_export_reads_only_the_tenant_rows_in_insert_order
      - run: cargo test -p praetore-replay-postgres --locked --test postgres -- --ignored claim_is_unique_and_survives_a_new_client
      - run: cargo test -p praetore-replay-postgres --locked --test postgres -- --ignored concurrent_connections_allow_exactly_one_claim
      - run: cargo test -p praetore-replay-postgres --locked --test postgres -- --ignored a_lost_database_connection_fails_closed_and_a_new_client_recovers
      - run: cargo test -p praetore-replay-postgres --locked --test postgres -- --ignored postgres_gateway_authorizes_and_persists_one_effect
      - run: cargo test -p praetore-replay-postgres --locked --test postgres -- --ignored postgres_atomic_commit_rolls_back_claim_when_journal_insert_fails
      - run: cargo test -p praetore-replay-postgres --locked --test postgres -- --ignored postgres_lost_commit_ack_is_verified_before_dispatch
      - run: cargo test -p praetore-replay-postgres --locked --test postgres -- --ignored postgres_unverifiable_commit_acknowledgement_blocks_dispatch
      - run: cargo test -p praetore-replay-postgres --locked --test postgres -- --ignored postgres_legacy_replay_claim_without_authorization_is_orphaned_and_blocked
      - run: cargo test -p praetore-replay-postgres --locked --test postgres -- --ignored postgres_journal_prevents_concurrent_duplicate_effects_across_engines
      - run: cargo test -p praetore-replay-postgres --locked --test postgres -- --ignored postgres_journal_rejects_execution_key_reused_with_different_action
      - run: cargo test -p praetore-replay-postgres --locked --test postgres -- --ignored postgres_observability_lists_filters_and_reads_real_transition_history
      - run: cargo test -p praetore-replay-postgres --locked --test postgres -- --ignored postgres_journal_failure_before_dispatch_prevents_effect
      - run: cargo test -p praetore-replay-postgres --locked --test postgres -- --ignored postgres_recovery_never_dispatches_authorized_or_ambiguous_rows
      - run: cargo test -p praetore-replay-postgres --locked --test postgres -- --ignored postgres_reconciliation_only_resolves_when_adapter_proves_outcome
      - run: cargo test -p praetore-replay-postgres --locked --test postgres -- --ignored postgres_effect_survives_failed_terminal_write_and_is_reconciled_without_retry
      - run: cargo test -p praetore-replay-postgres --locked --test postgres -- --ignored postgres_journal_terminal_states_cannot_return_to_dispatchable
      - name: Approved-pending-dispatch and migration tests (restart test excluded)
        env:
          PRAETORE_APD_RACES: "500"
        run: |
          set -euo pipefail
          # --exact plus the "1 passed" check: a renamed or missing test fails
          # the job instead of silently running zero tests.
          for test in \
            postgres_human_approval_is_persisted_atomically_and_consumed_once \
            postgres_migrations_apply_once_and_keep_0010_checks \
            postgres_migrations_baseline_empty_database_applies_everything_once \
            postgres_migrations_baseline_0009_database_records_without_reexecuting \
            postgres_migrations_baseline_partial_schema_fails_closed \
            postgres_migrations_unknown_version_refuses_to_start \
            postgres_apd_crash_between_approve_and_claim_closes_as_crash_recovered \
            postgres_apd_sigkill_between_approve_and_claim \
            postgres_apd_concurrent_claims_dispatch_exactly_once \
            postgres_apd_expiry_before_claim_closes_as_approval_expired \
            postgres_apd_journal_checks_use_the_injected_clock \
            postgres_apd_illegal_transitions_are_rejected_by_sql \
            postgres_apd_failed_approval_commit_leaves_the_request_pending_and_undispatched \
            postgres_apd_lost_claim_acknowledgement_never_invokes_the_adapter \
            postgres_apd_parse_record_rejects_forged_apd_rows; do
            echo "::group::$test"
            output="$(cargo test -p praetore-replay-postgres --locked --test postgres -- --ignored --exact "$test" 2>&1)" || { echo "$output"; exit 1; }
            echo "$output"
            echo "::endgroup::"
            grep -q "test result: ok. 1 passed" <<<"$output" || { echo "::error::$test did not run"; exit 1; }
          done
      - name: Runtime-role check connects as the postgres superuser
        run: |
          set -euo pipefail
          # initdb --username "$POSTGRES_USER" makes praetore the only superuser;
          # there is no role named postgres. The test logs in as postgres and
          # checks session_user, so create that role and then run only this test as it.
          container_id="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          exists="$(docker exec "$container_id" psql -U praetore -d praetore_test -tAc "SELECT 1 FROM pg_roles WHERE rolname = 'postgres'")"
          if [ "$exists" = "1" ]; then
            docker exec "$container_id" psql -U praetore -d praetore_test -v ON_ERROR_STOP=1 \
              -c "ALTER ROLE postgres WITH LOGIN SUPERUSER PASSWORD 'praetore-test'"
          else
            docker exec "$container_id" psql -U praetore -d praetore_test -v ON_ERROR_STOP=1 \
              -c "CREATE ROLE postgres LOGIN SUPERUSER PASSWORD 'praetore-test'"
          fi
          PRAETORE_TEST_DATABASE_URL=postgres://postgres:praetore-test@localhost:5432/praetore_test \
            cargo test -p praetore-replay-postgres --locked --test postgres -- --ignored --exact postgres_runtime_role_must_not_own_or_bypass_the_schema
      - name: Stage replay-claim restart test
        env:
          PRAETORE_TEST_RESTART_PHASE: before
        run: cargo test -p praetore-replay-postgres --locked --test postgres -- --ignored replay_claim_survives_server_restart
      - name: Stage execution-journal restart test
        env:
          PRAETORE_TEST_JOURNAL_RESTART_PHASE: before
        run: cargo test -p praetore-replay-postgres --locked --test postgres -- --ignored postgres_journal_survives_server_restart_without_automatic_dispatch
      - name: Stage approved-pending-dispatch restart test
        env:
          PRAETORE_TEST_APD_RESTART_PHASE: before
        run: cargo test -p praetore-replay-postgres --locked --test postgres -- --ignored --exact postgres_apd_and_migrations_survive_restart
      - name: Restart PostgreSQL service
        run: |
          container_id="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          docker restart "$container_id"
          until docker exec "$container_id" pg_isready -U praetore -d praetore_test; do sleep 1; done
      - name: Verify replay-claim recovery after restart
        env:
          PRAETORE_TEST_RESTART_PHASE: after
        run: cargo test -p praetore-replay-postgres --locked --test postgres -- --ignored replay_claim_survives_server_restart
      - name: Verify execution-journal recovery after restart
        env:
          PRAETORE_TEST_JOURNAL_RESTART_PHASE: after
        run: cargo test -p praetore-replay-postgres --locked --test postgres -- --ignored postgres_journal_survives_server_restart_without_automatic_dispatch
      - name: Verify approved-pending-dispatch recovery after restart
        env:
          PRAETORE_TEST_APD_RESTART_PHASE: after
        run: cargo test -p praetore-replay-postgres --locked --test postgres -- --ignored --exact postgres_apd_and_migrations_survive_restart

  sbom:
    name: CycloneDX SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-cyclonedx --version 0.5.9 --locked
      - run: cargo cyclonedx --manifest-path crates/praetore-core/Cargo.toml --format json --all
      - run: cargo cyclonedx --manifest-path crates/praetore-verify/Cargo.toml --format json --all
      - run: cargo cyclonedx --manifest-path crates/praetore-receipt/Cargo.toml --format json --all
      - run: cargo cyclonedx --manifest-path crates/praetore-python/Cargo.toml --format json --all
      - run: cargo cyclonedx --manifest-path crates/praetore-replay-postgres/Cargo.toml --format json --all
      - run: cargo cyclonedx --manifest-path crates/praetore-gateway/Cargo.toml --format json --all
      - run: cargo cyclonedx --manifest-path fuzz/Cargo.toml --format json --all
      - run: find crates fuzz -name '*.cdx.json' -print
      - uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: |
            crates/*/*.cdx.json
            fuzz/*.cdx.json
          if-no-files-found: error

  mcp-binaries:
    name: praetore-mcp ${{ matrix.target }} build and smoke
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          # Cross-built on Apple silicon; the smoke test runs it under Rosetta 2.
          - os: macos-15
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cargo build --release --locked --package praetore-mcp --target ${{ matrix.target }}
      - name: Install Rosetta 2 for the x86_64 smoke test
        if: matrix.target == 'x86_64-apple-darwin'
        run: softwareupdate --install-rosetta --agree-to-license
      - name: Show binary architecture
        run: file target/${{ matrix.target }}/release/praetore-mcp
      # A real tools/call allowed and one denied, through npx and
      # @modelcontextprotocol/server-filesystem@2.1.0, then `verify`.
      - name: End-to-end smoke test of the release binary
        run: python3 -I scripts/mcp-smoke.py target/${{ matrix.target }}/release/praetore-mcp
      - name: Package binary with its checksum
        shell: bash
        run: |
          version="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then version="${GITHUB_SHA::12}"; fi
          name="praetore-mcp-${version}-${{ matrix.target }}"
          mkdir -p "mcp-assets/${name}"
          cp target/${{ matrix.target }}/release/praetore-mcp "mcp-assets/${name}/"
          cp LICENSE NOTICE "mcp-assets/${name}/"
          # No AppleDouble ._ entries from macOS extended attributes.
          COPYFILE_DISABLE=1 tar -C mcp-assets -czf "mcp-assets/${name}.tar.gz" "${name}"
          cd mcp-assets
          shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"
          cat "${name}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: mcp-${{ matrix.target }}
          path: |
            mcp-assets/*.tar.gz
            mcp-assets/*.tar.gz.sha256
          if-no-files-found: error

  release-integrity:
    name: Release checksums
    # Runs on every push and PR so SHA256SUMS is checked before a tag needs
    # it; only a v* tag keeps the result as release-assets-<tag>.
    needs: mcp-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: scripts/test-release-checksums.sh
      - run: cargo build --release --locked --package praetore-verify
      - uses: actions/download-artifact@v4
        with:
          pattern: mcp-*
          path: mcp-assets
          merge-multiple: true
      - name: Prepare checksummed release assets
        run: |
          version="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then version="${GITHUB_SHA::12}"; fi
          scripts/release-checksums.sh "$version" mcp-assets target/release/praetore-verify release-assets
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: release-assets-${{ github.ref_name }}
          path: release-assets/*
          if-no-files-found: error
