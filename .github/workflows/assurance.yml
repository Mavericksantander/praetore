name: Assurance gates

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

# Every job needs to read the repository (checkout) and nothing else. Only
# release-sign and release-publish need more, and set their own.
permissions:
  contents: read

jobs:
  rust:
    name: Rust tests, lint, and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - run: cargo test --workspace --locked
      # G7: shown separately so the log shows each test ran. A renamed or
      # missing test fails the step (the counts are pinned).
      - name: G7 safety actions never reach the evaluator (output shown)
        run: |
          set -euo pipefail
          run() {
            local expected="$1"; shift
            echo "::group::$*"
            output="$("$@" 2>&1)" || { echo "$output"; exit 1; }
            echo "$output"
            echo "::endgroup::"
            grep -qE "$expected" <<<"$output" || { echo "::error::expected '$expected' from: $*"; exit 1; }
          }
          # compile_fail,E0308: an AuthorizationRequest cannot hold a SafetyAction.
          run "authorization::AuthorizationRequest \(line [0-9]+\) - compile fail \.\.\. ok" \
            cargo test --locked -p praetore-core --doc authorization::AuthorizationRequest
          run "test result: ok\. 19 passed" cargo test --locked -p praetore-core --test action_classes
          run "test result: ok\. 5 passed" \
            cargo test --locked -p praetore-gateway --test safety_actions -- --nocapture
          run "test result: ok\. 5 passed" cargo test --locked -p praetore-mcp --lib g7_ -- --nocapture
          run "test result: ok\. 4 passed" cargo test --locked -p praetore-gateway --test enforcement g7_
          run "test result: ok\. 2 passed" cargo test --locked -p praetore-verify --test unclassified_receipt
          # G2: the shared safety name validator and the signed safety
          # namespace manifest (core, `praetore policy safety-manifest`,
          # `praetore-verify safety-manifest`).
          run "test result: ok\. 21 passed" cargo test --locked -p praetore-core --test safety_namespace
          run "test result: ok\. 7 passed" cargo test --locked -p praetore-cli --test safety_manifest_cli
          run "test result: ok\. 8 passed" cargo test --locked -p praetore-verify --test safety_manifest_cli
          # G1: post-hoc safety ingestion (core types and chain verifier, the
          # non-blocking client, praetore-safety-ingest, journal-export
          # --safety and praetore-verify safety-journal). The PostgreSQL
          # end-to-end tests run in the replay-postgres job.
          run "test result: ok\. 34 passed" cargo test --locked -p praetore-core --lib safety_ingest
          run "test result: ok\. 5 passed" \
            cargo test --locked -p praetore-safety-client --test nonblocking -- --nocapture
          # 13 on Linux: secret_file's extended-ACL test is macOS only.
          run "test result: ok\. 13 passed" cargo test --locked -p praetore-cli --bin praetore-safety-ingest
          run "test result: ok\. 2 passed" cargo test --locked -p praetore-cli --bin praetore safety_export
          run "test result: ok\. 3 passed" cargo test --locked -p praetore-verify --test safety_journal_cli
      - name: T-013B confinement race tests (Linux, openat2 required, output shown)
        env:
          PRAETORE_REQUIRE_OPENAT2: "1"
        run: |
          cargo test --locked -p praetore-sandbox-fs -- --nocapture
          cargo test --locked -p praetore-gateway --lib -- --nocapture sandbox::tests::race sandbox::tests::require_openat2
      - run: cargo run --locked --package praetore-core --example high_assurance
      - name: Walkthrough demo (docs/DEMO.md; in-memory replay guard, fixed lease)
        run: make demo demo-verify
      - name: Receipt verification demo (DEMO/TEST-ONLY keys)
        run: ./demo/verify-receipt.sh
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --all -- --check
      - name: Validate Kubernetes manifest YAML syntax
        run: |
          ruby -e 'require "yaml"; Dir.glob("deploy/kubernetes/**/*.yaml").each { |path| YAML.load_stream(File.read(path)); puts "valid YAML: #{path}" }'
      - name: Check changed patch whitespace
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        run: git diff --check ${{ github.event.pull_request.base.sha || github.event.before }}...HEAD

  hook-evidence:
    name: Claude Code hook evidence (sets 03, 04, 05)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # verify.sh exits non-zero if any receipt fails, if a policy digest does
      # not match, or if a one-byte tampered copy is accepted.
      - name: Verify set 03
        run: ./examples/claude-code-hook/verify.sh examples/claude-code-hook/evidence/03-bundle-demo-reproducible
      - name: Verify set 04
        run: ./examples/claude-code-hook/verify.sh examples/claude-code-hook/evidence/04-sesion-real-bloqueada-web-fetch
      - name: Verify set 05
        run: ./examples/claude-code-hook/verify.sh examples/claude-code-hook/evidence/05-sesion-real-final

  journal-chain:
    name: Journal chains (sets 03, 04, 05) and tampered copies
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The expected heads are pinned here, separately from the chain files, so
    # a change to a chain file alone fails this job. They live in the same
    # repository, so this is not an external anchor (see VERIFY.md).
    env:
      HEAD_03: 4cea4fe91378a8471368b755e9bbdd23092e76a9d39517cc8e2cb393f83da90a
      HEAD_04: f1666f5447351b18896792e64c7994d27561896beca37ec695571b73882d5af0
      HEAD_05: 79a5374eaa24f8bc79d3c3818fbb2624154d93607e3ed3ee6434bef43ae146c9
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # verify-chain.sh exits non-zero if the chain or its head does not
      # verify, if re-exporting does not reproduce it byte for byte, or if any
      # tampered copy (deleted receipt, deleted and re-linked, truncated,
      # reordered, altered byte) is accepted.
      - name: Chain of set 03
        run: ./examples/claude-code-hook/verify-chain.sh examples/claude-code-hook/evidence/03-bundle-demo-reproducible "$HEAD_03"
      - name: Chain of set 04
        run: ./examples/claude-code-hook/verify-chain.sh examples/claude-code-hook/evidence/04-sesion-real-bloqueada-web-fetch "$HEAD_04"
      - name: Chain of set 05
        run: ./examples/claude-code-hook/verify-chain.sh examples/claude-code-hook/evidence/05-sesion-real-final "$HEAD_05"
      - name: A wrong expected head is rejected
        run: |
          if ./examples/claude-code-hook/verify-chain.sh examples/claude-code-hook/evidence/04-sesion-real-bloqueada-web-fetch "$HEAD_05"; then
            echo "::error::set 04 verified against the head of set 05"; exit 1
          fi

  macos:
    name: macOS workspace link
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: cargo build --workspace --locked
      - run: cargo test -p praetore-python --locked
      - name: T-013B confinement tests (macOS portable walk)
        run: cargo test --locked -p praetore-sandbox-fs -- --nocapture
      # The hook's replay store checks extended ACLs only on macOS (FFI to
      # acl_get_link_np): its tests must run here, and the ACL cases must
      # not be skipped.
      - name: Claude Code hook tests (macOS, ACL checks)
        run: |
          set -euo pipefail
          output="$(cargo test --manifest-path examples/claude-code-hook/Cargo.toml --locked -- --nocapture 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          grep -Eq "test result: ok\. [0-9]+ passed; 0 failed" <<<"$output" || { echo "::error::the hook tests failed"; exit 1; }
          for case in acl state-acl; do
            grep -q "replay store case $case: denied: .*extended ACL entries" <<<"$output" || { echo "::error::ACL case $case did not run"; exit 1; }
          done
          grep -q "acl check on macOS: none, entry, removed: ok" <<<"$output" || { echo "::error::the real ACL check test did not run"; exit 1; }

  verifier-features:
    name: Offline verifiers build without receipt signing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # `ExecutionAttestation::create` exists only with praetore-receipt's
      # `signing` feature. Workspace-wide commands unify features (the gateway
      # enables `signing`), so they cannot catch a verifier that starts
      # enabling it. Resolve each verifier on its own, over its shipped
      # (normal + build) dependency graph, with default and with all features,
      # and fail if `signing` appears.
      - name: praetore-verify and praetore-python do not enable signing
        run: |
          set -euo pipefail
          for package in praetore-verify praetore-python; do
            # Default features, then every optional feature of the package.
            for features in "" "--all-features"; do
              tree="$(cargo tree --locked -p "$package" $features --edges normal,build,features -i praetore-receipt)"
              printf '%s\n' "$tree"
              if grep -F 'praetore-receipt feature "signing"' <<<"$tree"; then
                echo "::error::$package ${features:-(default features)} enables praetore-receipt/signing"
                exit 1
              fi
            done
          done
      # Sanity check that the guard can fail: the gateway must enable it.
      - name: praetore-gateway does enable signing
        run: |
          set -euo pipefail
          for features in "" "--all-features"; do
            cargo tree --locked -p praetore-gateway $features --edges normal,build,features -i praetore-receipt | grep -F 'praetore-receipt feature "signing"'
          done
      - run: cargo check --locked -p praetore-verify
      - run: cargo check --locked -p praetore-python
      - run: cargo check --locked -p praetore-receipt --no-default-features

  audit:
    name: Dependency advisory audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit
      - run: cargo audit --file fuzz/Cargo.lock

  fuzz-smoke:
    name: Fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
        with:
          components: llvm-tools-preview
      - run: cargo +nightly install cargo-fuzz --locked
      - run: cargo +nightly check --manifest-path fuzz/Cargo.toml --locked
      - run: UPDATE_FUZZ_CORPUS=1 cargo test -p praetore-verify --test verify_cli evidence_command_verifies_trusted_signature_intent_and_authority --locked
      - run: cargo +nightly fuzz run --fuzz-dir fuzz canonical_json -- -max_total_time=10
      - run: cargo +nightly fuzz run --fuzz-dir fuzz policy_parse -- -max_total_time=10
      - run: cargo +nightly fuzz run --fuzz-dir fuzz authority_verify -- -max_total_time=10
      - run: cargo +nightly fuzz run --fuzz-dir fuzz evidence_verify -- -max_total_time=10
      - run: cargo +nightly fuzz run --fuzz-dir fuzz engine_evaluate_dev -- -max_total_time=10
      - run: cargo +nightly fuzz run --fuzz-dir fuzz engine_evaluate_high_assurance -- -max_total_time=10
      - run: cargo +nightly fuzz run --fuzz-dir fuzz path_prefix -- -max_total_time=10
      - run: cargo +nightly fuzz run --fuzz-dir fuzz safety_namespace -- -max_total_time=10
      - run: cargo +nightly fuzz run --fuzz-dir fuzz safety_ingest -- -max_total_time=10

  python-verify:
    name: Python evidence verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: UPDATE_PYTHON_FIXTURE=1 cargo test -p praetore-verify --test verify_cli evidence_command_verifies_trusted_signature_intent_and_authority --locked
      - run: python -m pip install ./packages/praetore-python
      - run: python -m unittest discover -s packages/praetore-python/tests -v
      - run: ./examples/third-party-verification/verify.sh

  claude-code-hook-example:
    name: Claude Code hook example (standalone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      # Not a workspace member: it has its own manifest and lockfile.
      - run: cargo fmt --manifest-path examples/claude-code-hook/Cargo.toml -- --check
      - run: cargo clippy --manifest-path examples/claude-code-hook/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path examples/claude-code-hook/Cargo.toml --locked
      - name: Verify the committed bundle with praetore-verify only
        run: ./examples/claude-code-hook/verify.sh
      # 1000 receipts must exit 0 (ls | head used to exit 141 on SIGPIPE) and
      # one altered receipt among them must not.
      - name: verify.sh on 1000 receipts and on one altered receipt
        run: ./examples/claude-code-hook/test-verify.sh
      # The hook writes HighAssurance receipts: every regenerated receipt
      # must record its signed decision time (decided_at).
      - name: Regenerate a bundle and verify it (with --require-decision-time)
        run: |
          ./examples/claude-code-hook/demo.sh "$RUNNER_TEMP/claude-code-hook-bundle"
          ./examples/claude-code-hook/verify.sh "$RUNNER_TEMP/claude-code-hook-bundle"
          ./examples/claude-code-hook/verify.sh "$RUNNER_TEMP/claude-code-hook-bundle" --require-decision-time
      # The flag must reject a receipt without decided_at with exactly
      # DECISION_TIME_MISSING. Fixture: examples/verify/evidence.json, a
      # signed v4 receipt without HighAssurance metadata that does not depend
      # on the hook bundle or the evidence sets being regenerated.
      - name: --require-decision-time rejects a receipt without decided_at
        run: |
          set -euo pipefail
          cargo build --quiet --release --locked --package praetore-verify
          set +e
          out="$(target/release/praetore-verify evidence --evidence examples/verify/evidence.json \
            --attester-pin examples/verify/attester-public-key.hex \
            --issuer-pins examples/verify/issuer-pins.jsonl --require-intent \
            --require-decision-time --format json)"
          rc=$?
          set -e
          echo "$out"
          [ "$rc" -ne 0 ] || { echo "::error::a receipt without decided_at passed"; exit 1; }
          python3 -c 'import json,sys; sys.exit(json.loads(sys.argv[1])["code"] != "DECISION_TIME_MISSING")' "$out" ||
            { echo "::error::expected DECISION_TIME_MISSING"; exit 1; }
          # Control: the same fixture verifies without the flag.
          target/release/praetore-verify evidence --evidence examples/verify/evidence.json \
            --attester-pin examples/verify/attester-public-key.hex \
            --issuer-pins examples/verify/issuer-pins.jsonl --require-intent --format json
      - name: HighAssurance hook tests (output shown)
        run: |
          set -euo pipefail
          output="$(cargo test --manifest-path examples/claude-code-hook/Cargo.toml --locked tests_high_assurance -- --nocapture 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          grep -Eq "test result: ok\. [0-9]+ passed; 0 failed" <<<"$output" || { echo "::error::the HighAssurance hook tests failed"; exit 1; }
          for test in every_receipt_records_a_signed_decision_time \
            declared_safety_tool_gets_no_receipt_and_no_claim \
            state_without_a_replay_store_is_refused_with_a_pointer_to_init \
            unavailable_replay_store_fails_closed \
            unwritable_receipts_journal_denies_and_leaves_an_orphan_claim \
            tool_use_id_is_signed_and_tampering_fails \
            same_tool_use_id_twice_is_allowed_and_reported \
            missing_tool_use_id_is_recorded_as_absent \
            tool_use_id_is_bounded_and_escaped \
            guard::replaying_the_same_request_is_refused \
            guard::guard_reports_unavailable_when_the_store_is \
            guard::concurrent_claims_of_one_request_succeed_exactly_once \
            guard::concurrent_hook_calls_each_claim_their_own_request \
            guard::directory_owned_by_another_user_is_refused; do
            grep -q "^test tests_high_assurance::$test \.\.\. ok$" <<<"$output" || { echo "::error::$test did not run or failed"; exit 1; }
          done
      # SAF-14: two agents sign with different issued identities, and no
      # edit of index.json or of the receipt re-attributes a receipt.
      - name: Per-agent attribution end to end
        run: ./examples/claude-code-hook/test-attribution.sh
      - name: G7 hook safety-action tests (output shown)
        run: |
          set -euo pipefail
          output="$(cargo test --manifest-path examples/claude-code-hook/Cargo.toml --locked tests_g7 -- --nocapture 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          grep -q "test result: ok. 8 passed" <<<"$output" || { echo "::error::the G7 hook tests did not run"; exit 1; }

  g7-mutation:
    name: G7 mutation test (classify removed from each entry point)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # Applies scripts/g7-mutants/*.patch one at a time and requires the G7
      # runtime tests to fail on every mutant; exits 1 if one survives.
      - run: ./scripts/g7-mutation-test.sh

  g1-mutation:
    name: G1 mutation test (gap check and rejected records removed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # Applies scripts/g1-mutants/*.patch one at a time (the ingester's gap
      # check, the verifier's gap check, the rejected-record path) and
      # requires the G1 tests to fail on every mutant; exits 1 if one
      # survives.
      - run: ./scripts/g1-mutation-test.sh

  replay-postgres:
    name: PostgreSQL replay guard integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: praetore
          POSTGRES_PASSWORD: praetore-test
          POSTGRES_DB: praetore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U praetore -d praetore_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PRAETORE_TEST_DATABASE_URL: postgres://praetore:praetore-test@localhost:5432/praetore_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: cargo test -p praetore-replay-postgres --locked
      - name: Missing praetore_runtime is refused up front (runs first, before any test creates the role)
        run: |
          set -euo pipefail
          output="$(cargo test -p praetore-replay-postgres --locked --test postgres -- --ignored --exact postgres_migrations_refuse_a_missing_runtime_group_up_front --nocapture 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          grep -q "test result: ok. 1 passed" <<<"$output" || { echo "::error::the test did not run"; exit 1; }
          grep -q "RUNTIME_GROUP_ABSENT_CHECKED" <<<"$output" || { echo "::error::praetore_runtime already existed; the check did not run"; exit 1; }
      - name: journal-export against PostgreSQL (RLS as the runtime role, order, CLI end to end)
        run: |
          set -euo pipefail
          # The end-to-end test runs target/debug/praetore-verify. The tests
          # create their own LOGIN member of praetore_runtime (migration 0011)
          # with the superuser in PRAETORE_TEST_DATABASE_URL.
          cargo build -p praetore-verify --locked
          for test in \
            "--bin praetore journal_export::tests::postgres_export_reads_only_the_tenant_rows_in_insert_order" \
            "--bin praetore journal_export::tests::postgres_export_as_runtime_role_is_confined_by_row_level_security" \
            "--bin praetore journal_export::tests::postgres_export_orders_by_created_at_then_request_id_then_agent_id" \
            "--test journal_export_postgres postgres_cli_journal_export_tenant_end_to_end" \
            "--test journal_export_postgres postgres_cli_journal_export_after_attester_key_rotation" \
            "--test journal_export_postgres postgres_cli_run_reports_a_port_in_use" \
            "--bin praetore journal_export::tests::postgres_database_export_and_tenant_reference" \
            "--bin praetore tests::postgres_find_pending_agent_ignores_hostile_search_path"; do
            read -r flag target name <<<"$test"
            echo "::group::$name"
            output="$(cargo test -p praetore-cli --locked "$flag" "$target" -- --ignored --exact "$name" 2>&1)" || { echo "$output"; exit 1; }
            echo "$output"
            echo "::endgroup::"
            grep -q "test result: ok. 1 passed" <<<"$output" || { echo "::error::$name did not run"; exit 1; }
          done
      - name: G1 safety ingestion against PostgreSQL (binary, flood, sender check, export, verify)
        run: |
          set -euo pipefail
          # The end-to-end tests run target/debug/praetore-verify and the
          # praetore-safety-ingest binary; each uses its own scratch
          # database and login role. Every ignored test of the file runs
          # (the praetore-replay-postgres G1 tests run in the next step).
          cargo build -p praetore-verify --locked
          tests="$(cargo test -q -p praetore-cli --locked --test safety_ingest_postgres -- --ignored --list 2>/dev/null | sed -n 's/: test$//p')"
          [ "$(wc -w <<<"$tests")" -ge 5 ] || { echo "::error::expected at least 5 G1 end-to-end tests: $tests"; exit 1; }
          for name in $tests; do
            echo "::group::$name"
            output="$(cargo test -p praetore-cli --locked --test safety_ingest_postgres -- --ignored --exact "$name" --nocapture 2>&1)" || { echo "$output"; exit 1; }
            echo "$output"
            echo "::endgroup::"
            grep -q "test result: ok. 1 passed" <<<"$output" || { echo "::error::$name did not run"; exit 1; }
          done
      - name: Services report a port in use (praetore-gateway-demo, praetore-observe)
        run: |
          set -euo pipefail
          for test in \
            "praetore-gateway-service postgres_gateway_service_reports_a_port_in_use" \
            "praetore-observe postgres_observe_reports_a_port_in_use"; do
            read -r package name <<<"$test"
            echo "::group::$name"
            output="$(cargo test -p "$package" --locked --test port_in_use -- --ignored --exact "$name" 2>&1)" || { echo "$output"; exit 1; }
            echo "$output"
            echo "::endgroup::"
            grep -q "test result: ok. 1 passed" <<<"$output" || { echo "::error::$name did not run"; exit 1; }
          done
      - name: Every other ignored PostgreSQL test (migrations through 0017, G1 safety records)
        env:
          PRAETORE_APD_RACES: "500"
        # One test at a time with --exact; each must report "1 passed". The
        # tests that need their own step (run first, as the postgres
        # superuser, or around a restart) are listed in the script, which
        # fails if one of them no longer exists.
        run: ./scripts/postgres-ignored-tests.sh
      - name: Runtime-role check connects as the postgres superuser
        run: |
          set -euo pipefail
          # initdb --username "$POSTGRES_USER" makes praetore the only superuser;
          # there is no role named postgres. The test logs in as postgres and
          # checks session_user, so create that role and then run only this test as it.
          container_id="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          exists="$(docker exec "$container_id" psql -U praetore -d praetore_test -tAc "SELECT 1 FROM pg_roles WHERE rolname = 'postgres'")"
          if [ "$exists" = "1" ]; then
            docker exec "$container_id" psql -U praetore -d praetore_test -v ON_ERROR_STOP=1 \
              -c "ALTER ROLE postgres WITH LOGIN SUPERUSER PASSWORD 'praetore-test'"
          else
            docker exec "$container_id" psql -U praetore -d praetore_test -v ON_ERROR_STOP=1 \
              -c "CREATE ROLE postgres LOGIN SUPERUSER PASSWORD 'praetore-test'"
          fi
          PRAETORE_TEST_DATABASE_URL=postgres://postgres:praetore-test@localhost:5432/praetore_test \
            cargo test -p praetore-replay-postgres --locked --test postgres -- --ignored --exact postgres_runtime_role_must_not_own_or_bypass_the_schema
      - name: Stage replay-claim restart test
        env:
          PRAETORE_TEST_RESTART_PHASE: before
        run: cargo test -p praetore-replay-postgres --locked --test postgres -- --ignored replay_claim_survives_server_restart
      - name: Stage execution-journal restart test
        env:
          PRAETORE_TEST_JOURNAL_RESTART_PHASE: before
        run: cargo test -p praetore-replay-postgres --locked --test postgres -- --ignored postgres_journal_survives_server_restart_without_automatic_dispatch
      - name: Stage approved-pending-dispatch restart test
        env:
          PRAETORE_TEST_APD_RESTART_PHASE: before
        run: cargo test -p praetore-replay-postgres --locked --test postgres -- --ignored --exact postgres_apd_and_migrations_survive_restart
      - name: Restart PostgreSQL service
        run: |
          container_id="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          docker restart "$container_id"
          until docker exec "$container_id" pg_isready -U praetore -d praetore_test; do sleep 1; done
      - name: Verify replay-claim recovery after restart
        env:
          PRAETORE_TEST_RESTART_PHASE: after
        run: cargo test -p praetore-replay-postgres --locked --test postgres -- --ignored replay_claim_survives_server_restart
      - name: Verify execution-journal recovery after restart
        env:
          PRAETORE_TEST_JOURNAL_RESTART_PHASE: after
        run: cargo test -p praetore-replay-postgres --locked --test postgres -- --ignored postgres_journal_survives_server_restart_without_automatic_dispatch
      - name: Verify approved-pending-dispatch recovery after restart
        env:
          PRAETORE_TEST_APD_RESTART_PHASE: after
        run: cargo test -p praetore-replay-postgres --locked --test postgres -- --ignored --exact postgres_apd_and_migrations_survive_restart

  sbom:
    name: CycloneDX SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: cargo install cargo-cyclonedx --version 0.5.9 --locked
      - run: cargo cyclonedx --manifest-path crates/praetore-core/Cargo.toml --format json --all
      - run: cargo cyclonedx --manifest-path crates/praetore-verify/Cargo.toml --format json --all
      - run: cargo cyclonedx --manifest-path crates/praetore-receipt/Cargo.toml --format json --all
      - run: cargo cyclonedx --manifest-path crates/praetore-python/Cargo.toml --format json --all
      - run: cargo cyclonedx --manifest-path crates/praetore-replay-postgres/Cargo.toml --format json --all
      - run: cargo cyclonedx --manifest-path crates/praetore-gateway/Cargo.toml --format json --all
      - run: cargo cyclonedx --manifest-path crates/praetore-safety-client/Cargo.toml --format json --all
      - run: cargo cyclonedx --manifest-path fuzz/Cargo.toml --format json --all
      - run: find crates fuzz -name '*.cdx.json' -print
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cyclonedx-sbom
          path: |
            crates/*/*.cdx.json
            fuzz/*.cdx.json
          if-no-files-found: error

  actions-pinned:
    name: Actions pinned by commit SHA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: scripts/test-check-actions-pinned.sh
      - run: scripts/check-actions-pinned.sh

  mcp-binaries:
    name: praetore-mcp ${{ matrix.target }} build and smoke
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          # Cross-built on Apple silicon; the smoke test runs it under Rosetta 2.
          - os: macos-15
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - run: cargo build --release --locked --package praetore-mcp --target ${{ matrix.target }}
      - name: Install Rosetta 2 for the x86_64 smoke test
        if: matrix.target == 'x86_64-apple-darwin'
        run: softwareupdate --install-rosetta --agree-to-license
      - name: Show binary architecture
        run: file target/${{ matrix.target }}/release/praetore-mcp
      # A real tools/call allowed and one denied, through npx and
      # @modelcontextprotocol/server-filesystem@2.1.0, then `verify`.
      - name: End-to-end smoke test of the release binary
        run: python3 -I scripts/mcp-smoke.py target/${{ matrix.target }}/release/praetore-mcp
      - name: Package binary with its checksum
        shell: bash
        run: |
          version="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then version="${GITHUB_SHA::12}"; fi
          name="praetore-mcp-${version}-${{ matrix.target }}"
          mkdir -p "mcp-assets/${name}"
          cp target/${{ matrix.target }}/release/praetore-mcp "mcp-assets/${name}/"
          cp LICENSE NOTICE "mcp-assets/${name}/"
          # No AppleDouble ._ entries from macOS extended attributes.
          COPYFILE_DISABLE=1 tar -C mcp-assets -czf "mcp-assets/${name}.tar.gz" "${name}"
          cd mcp-assets
          shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"
          cat "${name}.tar.gz.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mcp-${{ matrix.target }}
          path: |
            mcp-assets/*.tar.gz
            mcp-assets/*.tar.gz.sha256
          if-no-files-found: error

  release-integrity:
    name: Release checksums
    # Runs on every push and PR so SHA256SUMS is checked before a tag needs
    # it; only a v* tag keeps the result as release-assets-<tag>.
    needs: mcp-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: scripts/test-release-checksums.sh
      - run: scripts/test-release-notes.sh
      - name: Release notes exist for the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" > /dev/null
      - name: Tag matches the workspace version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "praetore-mcp") | .version')
          if [[ "v${version}" != "$GITHUB_REF_NAME" ]]; then
            echo "error: tag $GITHUB_REF_NAME does not match workspace version $version"
            exit 1
          fi
      - run: cargo build --release --locked --package praetore-verify
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: mcp-*
          path: mcp-assets
          merge-multiple: true
      - name: Prepare checksummed release assets
        run: |
          version="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then version="${GITHUB_SHA::12}"; fi
          scripts/release-checksums.sh "$version" mcp-assets target/release/praetore-verify release-assets
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
        with:
          cosign-release: v2.4.1
      # Exercises the signing tooling on every run with a throwaway key and no
      # transparency-log upload; the tag job below signs keylessly instead.
      - name: Sign and verify SHA256SUMS with a throwaway key
        run: |
          work=$(mktemp -d)
          (cd "$work" && COSIGN_PASSWORD= cosign generate-key-pair)
          COSIGN_PASSWORD= cosign sign-blob --yes --key "$work/cosign.key" --tlog-upload=false \
            --bundle "$work/SHA256SUMS.bundle" release-assets/SHA256SUMS
          cosign verify-blob --key "$work/cosign.pub" --insecure-ignore-tlog=true \
            --bundle "$work/SHA256SUMS.bundle" release-assets/SHA256SUMS
          cp release-assets/SHA256SUMS "$work/tampered"
          echo "0000  extra" >> "$work/tampered"
          if cosign verify-blob --key "$work/cosign.pub" --insecure-ignore-tlog=true \
              --bundle "$work/SHA256SUMS.bundle" "$work/tampered"; then
            echo "error: a changed SHA256SUMS verified"
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: release-assets-${{ github.ref_name }}
          path: release-assets/*
          if-no-files-found: error

  release-sign:
    name: Sign release checksums
    if: startsWith(github.ref, 'refs/tags/v')
    # Every gate must pass on the tag, not only the release artifacts.
    needs:
      - rust
      - hook-evidence
      - journal-chain
      - macos
      - verifier-features
      - audit
      - fuzz-smoke
      - python-verify
      - claude-code-hook-example
      - g7-mutation
      - g1-mutation
      - replay-postgres
      - sbom
      - actions-pinned
      - release-integrity
    runs-on: ubuntu-latest
    # Can obtain a signing identity but cannot write to the repository, and
    # needs no checkout: artifacts of this run use the runner's own token.
    permissions:
      id-token: write # Sigstore keyless signing; CI holds no signing key
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets-${{ github.ref_name }}
          path: release-assets
      - name: Re-check SHA256SUMS
        run: cd release-assets && sha256sum -c SHA256SUMS
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
        with:
          cosign-release: v2.4.1
      - name: Sign SHA256SUMS (Sigstore keyless)
        run: |
          cosign sign-blob --yes --bundle release-assets/SHA256SUMS.sigstore.json \
            release-assets/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-signature-${{ github.ref_name }}
          path: release-assets/SHA256SUMS.sigstore.json
          if-no-files-found: error

  release-publish:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-sign
    runs-on: ubuntu-latest
    # Can write to the repository but cannot obtain a signing identity.
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets-${{ github.ref_name }}
          path: release-assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-signature-${{ github.ref_name }}
          path: release-assets
      - name: Re-check SHA256SUMS
        run: cd release-assets && sha256sum -c SHA256SUMS
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
        with:
          cosign-release: v2.4.1
      # The signature came through the artifact store: check it before publishing.
      - name: Verify the signature against this workflow's identity
        run: |
          cosign verify-blob --bundle release-assets/SHA256SUMS.sigstore.json \
            --certificate-identity "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/assurance.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-github-workflow-sha "$GITHUB_SHA" \
            release-assets/SHA256SUMS
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/release-notes.sh "$GITHUB_REF_NAME" > release-notes.md
          # Never overwrite or add to an existing release.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "error: release $GITHUB_REF_NAME already exists"
            exit 1
          fi
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "PRÆTORE $GITHUB_REF_NAME" --notes-file release-notes.md \
            "${prerelease[@]}" release-assets/*
