apiVersion: v1
kind: Namespace
metadata:
  name: praetore-sandbox
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: praetore-sandbox-supervisor
  namespace: praetore-sandbox
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: praetore-sandbox-worker
  namespace: praetore-sandbox
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: praetore-sandbox-supervisor
  namespace: praetore-sandbox
rules:
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - create
      - get
      - list
      - watch
      - delete
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
      - get
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: praetore-sandbox-supervisor
  namespace: praetore-sandbox
subjects:
  - kind: ServiceAccount
    name: praetore-sandbox-supervisor
    namespace: praetore-sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: praetore-sandbox-supervisor
