apiVersion: v1
kind: Namespace
metadata:
  name: praetore-sandbox
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Service
metadata:
  name: praetore-sandbox-supervisor
  namespace: praetore-sandbox
  labels:
    app.kubernetes.io/name: praetore-sandbox-supervisor
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: praetore-sandbox-supervisor
  ports:
    - name: https
      port: 8443
      targetPort: 8443
      protocol: TCP
    - name: worker-results
      port: 8444
      targetPort: 8444
      protocol: TCP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: praetore-sandbox-supervisor
  namespace: praetore-sandbox
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: praetore-sandbox-worker
  namespace: praetore-sandbox
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: praetore-sandbox-supervisor
  namespace: praetore-sandbox
rules:
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - create
      - get
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: praetore-sandbox-supervisor
  namespace: praetore-sandbox
subjects:
  - kind: ServiceAccount
    name: praetore-sandbox-supervisor
    namespace: praetore-sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: praetore-sandbox-supervisor
---
# Operator-owned retention job for execution claims. It may delete claims
# only after checking that the PostgreSQL journal row for the execution key
# is terminal (see docs/runtime-security-scaffold.md). The ServiceAccount
# lives outside praetore-sandbox so the supervisor cannot use it; admission
# (praetore-sandbox-execution-claims) names this exact identity.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: praetore-sandbox-claim-retention
  namespace: praetore-sandbox
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: praetore-sandbox-claim-retention
  namespace: praetore-sandbox
subjects:
  - kind: ServiceAccount
    name: claim-retention
    namespace: praetore-security
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: praetore-sandbox-claim-retention
