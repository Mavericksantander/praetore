apiVersion: batch/v1
kind: Job
metadata:
  name: tool-replace-with-52-char-execution-id
  namespace: praetore-sandbox
  labels:
    praetore.io/component: tool-invocation
    praetore.io/execution-id: replace-with-52-char-execution-key-hash
    praetore.io/action-digest: replace-with-52-char-action-hash
    praetore.io/tool-profile: replace-with-approved-profile
  annotations:
    praetore.io/execution-key-sha256: replace-with-full-execution-key-sha256
    praetore.io/action-sha256: replace-with-full-action-sha256
    praetore.io/result-token-sha256: replace-with-full-result-token-sha256
spec:
  suspend: true
  completions: 1
  parallelism: 1
  backoffLimit: 0
  activeDeadlineSeconds: 120
  ttlSecondsAfterFinished: 120
  template:
    metadata:
      labels:
        praetore.io/component: tool-invocation
        praetore.io/execution-id: replace-with-52-char-execution-key-hash
        praetore.io/action-digest: replace-with-52-char-action-hash
        praetore.io/tool-profile: replace-with-approved-profile
      annotations:
        praetore.io/execution-key-sha256: replace-with-full-execution-key-sha256
        praetore.io/action-sha256: replace-with-full-action-sha256
        praetore.io/result-token-sha256: replace-with-full-result-token-sha256
    spec:
      runtimeClassName: praetore-firecracker
      restartPolicy: Never
      terminationGracePeriodSeconds: 5
      automountServiceAccountToken: false
      serviceAccountName: praetore-sandbox-worker
      enableServiceLinks: false
      hostNetwork: false
      hostPID: false
      hostIPC: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tool-runner
          image: replace-with-reviewed-image-at-sha256-digest
          imagePullPolicy: Always
          command:
            - /usr/local/bin/praetore-tool-runner
          args:
            - --invocation
            - /run/praetore/invocation/invocation.json
          env:
            - name: PRAETORE_RESULT_URL
              value: https://praetore-sandbox-supervisor.praetore-sandbox.svc.cluster.local:8444/v1/results
            - name: PRAETORE_RESULT_TOKEN_FILE
              value: /run/praetore/invocation/result-token
            - name: PRAETORE_RESULT_CA_FILE
              value: /run/praetore/supervisor-ca/ca.crt
            - name: HTTPS_PROXY
              value: http://egress-proxy.praetore-egress.svc.cluster.local:3128
            - name: HTTP_PROXY
              value: http://egress-proxy.praetore-egress.svc.cluster.local:3128
            - name: NO_PROXY
              value: praetore-sandbox-supervisor.praetore-sandbox.svc.cluster.local
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: "1"
              memory: 512Mi
              ephemeral-storage: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: invocation
              mountPath: /run/praetore/invocation
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: supervisor-ca
              mountPath: /run/praetore/supervisor-ca
              readOnly: true
      volumes:
        - name: invocation
          secret:
            secretName: inv-replace-with-52-char-execution-key-hash
            defaultMode: 0440
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: supervisor-ca
          configMap:
            name: praetore-sandbox-supervisor-ca
            items:
              - key: ca.crt
                path: ca.crt
