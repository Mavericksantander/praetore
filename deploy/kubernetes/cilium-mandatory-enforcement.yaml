apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: praetore-agent-egress
  namespace: praetore-agents
spec:
  endpointSelector:
    matchLabels:
      praetore.io/role: agent
  ingress: []
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: praetore-gateway
            app.kubernetes.io/name: praetore-gateway
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "praetore-gateway.praetore-gateway.svc.cluster.local."
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: praetore-gateway-ingress-egress
  namespace: praetore-gateway
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: praetore-gateway
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: praetore-agents
            praetore.io/role: agent
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: praetore-data
            app.kubernetes.io/name: postgres
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: praetore-egress
            app.kubernetes.io/name: gateway-egress-proxy
      toPorts:
        - ports:
            - port: "3128"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: praetore-sandbox
            app.kubernetes.io/name: praetore-sandbox-supervisor
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "postgres.praetore-data.svc.cluster.local."
              - matchPattern: "gateway-egress-proxy.praetore-egress.svc.cluster.local."
              - matchPattern: "praetore-sandbox-supervisor.praetore-sandbox.svc.cluster.local."
---
# Two proxies with separate identities. The gateway proxy is the only path to
# protected tools and is reachable only from the gateway. Sandbox tool runners
# use their own proxy (the egress-proxy Service name is fixed in the
# supervisor's Job spec and in admission), which can reach only explicitly
# allowed external destinations and never praetore-tools.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: praetore-gateway-egress-proxy-allowlist
  namespace: praetore-egress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: gateway-egress-proxy
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: praetore-gateway
            app.kubernetes.io/name: praetore-gateway
      toPorts:
        - ports:
            - port: "3128"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: praetore-tools
            praetore.io/role: protected-tool
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchName: api.example.com
              - matchPattern: "*.api.example.com"
              - matchPattern: "*.praetore-tools.svc.cluster.local."
    - toFQDNs:
        - matchName: api.example.com
        - matchPattern: "*.api.example.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: praetore-sandbox-egress-proxy-allowlist
  namespace: praetore-egress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: egress-proxy
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: praetore-sandbox
            praetore.io/component: tool-invocation
      toPorts:
        - ports:
            - port: "3128"
              protocol: TCP
  # Replace runner-tools.example.com with the exact destinations the approved
  # tool profiles need. No in-cluster endpoint is allowed.
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchName: runner-tools.example.com
    - toFQDNs:
        - matchName: runner-tools.example.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: praetore-sandbox-default-deny
  namespace: praetore-sandbox
spec:
  endpointSelector: {}
  ingress: []
  egress: []
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: praetore-sandbox-supervisor
  namespace: praetore-sandbox
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: praetore-sandbox-supervisor
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: praetore-gateway
            app.kubernetes.io/name: praetore-gateway
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: praetore-sandbox
            praetore.io/component: tool-invocation
      toPorts:
        - ports:
            - port: "8444"
              protocol: TCP
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchName: kubernetes.default.svc.cluster.local.
              - matchName: praetore-sandbox-supervisor.praetore-sandbox.svc.cluster.local.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: praetore-sandbox-worker
  namespace: praetore-sandbox
spec:
  endpointSelector:
    matchLabels:
      praetore.io/component: tool-invocation
  ingress: []
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: praetore-sandbox
            app.kubernetes.io/name: praetore-sandbox-supervisor
      toPorts:
        - ports:
            - port: "8444"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: praetore-egress
            app.kubernetes.io/name: egress-proxy
      toPorts:
        - ports:
            - port: "3128"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchName: praetore-sandbox-supervisor.praetore-sandbox.svc.cluster.local.
              - matchName: egress-proxy.praetore-egress.svc.cluster.local.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: protected-tools-ingress-only-from-egress-proxy
  namespace: praetore-tools
spec:
  endpointSelector:
    matchLabels:
      praetore.io/role: protected-tool
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: praetore-egress
            app.kubernetes.io/name: gateway-egress-proxy
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
