apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: praetore-sandbox-default-deny
  namespace: praetore-sandbox
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: praetore-sandbox-supervisor-ingress
  namespace: praetore-sandbox
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: praetore-sandbox-supervisor
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: praetore-gateway
          podSelector:
            matchLabels:
              app.kubernetes.io/name: praetore-gateway
      ports:
        - protocol: TCP
          port: 8443
    - from:
        - podSelector:
            matchLabels:
              praetore.io/component: tool-invocation
      ports:
        - protocol: TCP
          port: 8444
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: praetore-sandbox-worker-egress
  namespace: praetore-sandbox
spec:
  podSelector:
    matchLabels:
      praetore.io/component: tool-invocation
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: praetore-sandbox-supervisor
      ports:
        - protocol: TCP
          port: 8444
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: praetore-egress
          podSelector:
            matchLabels:
              app.kubernetes.io/name: egress-proxy
      ports:
        - protocol: TCP
          port: 3128
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
