# Namespace floor: every pod in praetore-sandbox is denied all ingress and
# egress unless a policy below allows it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: praetore-sandbox-default-deny
  namespace: praetore-sandbox
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: praetore-sandbox-supervisor-ingress
  namespace: praetore-sandbox
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: praetore-sandbox-supervisor
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: praetore-gateway
          podSelector:
            matchLabels:
              app.kubernetes.io/name: praetore-gateway
      ports:
        - protocol: TCP
          port: 8443
    - from:
        - podSelector:
            matchLabels:
              praetore.io/component: tool-invocation
      ports:
        - protocol: TCP
          port: 8444
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: praetore-sandbox-worker-egress
  namespace: praetore-sandbox
spec:
  podSelector:
    matchLabels:
      praetore.io/component: tool-invocation
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: praetore-sandbox-supervisor
      ports:
        - protocol: TCP
          port: 8444
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: praetore-egress
          podSelector:
            matchLabels:
              app.kubernetes.io/name: egress-proxy
      ports:
        - protocol: TCP
          port: 3128
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# The supervisor creates Jobs and Secrets through the Kubernetes API
# (KUBERNETES_SERVICE_HOST, an IP address). A portable NetworkPolicy cannot
# select the API server, so this allows TCP 443 and 6443 to any address:
# replace 0.0.0.0/0 with the API server endpoint addresses of the target
# cluster, or restrict the path with the cluster firewall.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: praetore-sandbox-supervisor-egress
  namespace: praetore-sandbox
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: praetore-sandbox-supervisor
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
