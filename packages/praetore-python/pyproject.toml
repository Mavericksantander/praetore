[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "praetore"
version = "0.2.0"
description = "Thin Python bindings for PRÆTORE evidence verification"
requires-python = ">=3.9"
license = { text = "LicenseRef-PRAETORE-OPEN-CORE" }
authors = [
    { name = "PRÆTOR TECHNOLOGIES" }
]

[tool.maturin]
manifest-path = "../../crates/praetore-python/Cargo.toml"
python-source = "src"
module-name = "praetore._core"