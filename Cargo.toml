[workspace]
resolver = "2"
members = [
    "crates/praetore-core",
    "crates/praetore-receipt",
    "crates/praetore-verify",
    "crates/praetore-python",
    "crates/praetore-replay-postgres",
    "crates/praetore-gateway",
    "crates/praetore-gateway-service",
    "crates/praetore-cli",
    "crates/praetore-observe",
    "crates/praetore-mcp",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
authors = ["José Tomás Enrique Santander Muñoz"]
repository = "https://github.com/Mavericksantander/praetore"
