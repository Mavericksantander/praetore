[package]
name = "praetore-replay-postgres"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

description = "PostgreSQL-backed durable replay guard for PRÆTORE HighAssurance deployments."

[dependencies]
postgres = { version = "0.19", features = ["with-time-0_3", "with-uuid-1", "with-serde_json-1"] }
hex = "0.4.3"
praetore-gateway = { path = "../praetore-gateway" }
praetore-core = { path = "../praetore-core" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1.0"
sha2 = "0.11.0"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", default-features = false }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
uuid = { version = "1.18", features = ["v4"] }

[dev-dependencies]
# G7: the HTTP entry point test drives the gateway router and counts engine
# calls with the test-only probe.
axum = { version = "0.8", default-features = false }
ed25519-dalek = { version = "2", features = ["rand_core"] }
praetore-core = { path = "../praetore-core", features = ["test-probe"] }
tower = { version = "0.5", features = ["util"] }
