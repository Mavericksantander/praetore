[package]
name = "praetore-replay-postgres"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

description = "PostgreSQL-backed durable replay guard for PRÆTORE HighAssurance deployments."

[dependencies]
postgres = { version = "0.19", features = ["with-time-0_3", "with-uuid-1"] }
hex = "0.4.3"
praetore-gateway = { path = "../praetore-gateway" }
praetore-core = { path = "../praetore-core" }
serde_json = "1.0"
sha2 = "0.11.0"
time = { version = "0.3", features = ["formatting", "parsing"] }
uuid = { version = "1.18", features = ["v4"] }
