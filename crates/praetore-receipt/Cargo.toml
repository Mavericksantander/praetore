[package]
name = "praetore-receipt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

description = "Signed PRÆTORE gateway receipts and execution attestations, without server dependencies."

[dependencies]
hex = "0.4.3"
praetore-core = { path = "../praetore-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing"] }
uuid = "1.18"
