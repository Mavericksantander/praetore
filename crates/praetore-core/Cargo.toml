[package]
name = "praetore-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

description = "Trusted authorization and governance core for autonomous agents."

[lib]
name = "praetore_core"
crate-type = ["lib"]

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
hex = "0.4.3"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
sha2 = "0.11.0"
subtle = "2.6.1"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing"] }
uuid = { version = "1.18", features = ["v4", "serde"] }

[features]
# Test-only counters of engine and policy evaluations (G7 runtime tests).
# Off by default; workspace crates enable it only from [dev-dependencies],
# so it is absent from release builds. It counts calls and changes nothing.
# Note: one cargo invocation that builds binaries and tests together (for
# example `cargo build --workspace --all-targets`) unifies dev-dependency
# features into those binaries; build release binaries on their own
# (`cargo build --release -p <package>`).
test-probe = []

[dev-dependencies]
proptest = "1"

# Black-box decision-layer tests live at the repository root (`tests/core/`).
# The workspace root is virtual, so the file is compiled as a test target of
# this crate. Releases ship as GitHub Release assets, not via crates.io; if the
# crate is ever packaged, `cargo package` warns that the file is outside the
# package and drops this test target from the packaged manifest.
[[test]]
name = "decision"
path = "../../tests/core/decision.rs"
