[package]
name = "praetore-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

description = "Trusted authorization and governance core for autonomous agents."

[lib]
name = "praetore_core"
crate-type = ["lib"]

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
hex = "0.4.3"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
subtle = "2.6.1"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing"] }
uuid = { version = "1.18", features = ["v4", "serde"] }

[features]
# SAF-10: property tests written against the not-yet-implemented API.
# Enabling this is expected to fail to compile until SAF-10 step 3 lands.
saf10-pending = []

[dev-dependencies]
proptest = "1"
