[package]
name = "praetore-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

description = "Local PostgreSQL-backed PRÆTORE gateway demo CLI."

[[bin]]
name = "praetore"
path = "src/main.rs"

# G1 (SAF-09.5): post-hoc safety ingestion, a separate process with its own
# database role and key.
[[bin]]
name = "praetore-safety-ingest"
path = "src/safety_ingest_main.rs"

[dependencies]
ed25519-dalek = "2"
hex = "0.4.3"
praetore-core = { path = "../praetore-core" }
praetore-gateway = { path = "../praetore-gateway" }
praetore-replay-postgres = { path = "../praetore-replay-postgres" }
postgres = "0.19"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = "1.18"

[target.'cfg(unix)'.dependencies]
# G2: open secret files with O_NOFOLLOW and check the open descriptor
# (`secret_file.rs`), and the effective uid for the owner check.
rustix = { version = "1.1", default-features = false, features = ["std", "fs", "net", "process"] }

[dev-dependencies]
praetore-safety-client = { path = "../praetore-safety-client" }

[target.'cfg(unix)'.dev-dependencies]
# D-B1 test: RLIMIT_FSIZE and SIGXFSZ for a child `praetore run`.
libc = "0.2"
