<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRÆTORE MCP receipts</title>
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3Z" fill="currentColor" opacity=".18"/><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="m8.5 12 2.5 2.5 4.5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span class="brand-text"><strong>PRÆTORE</strong><small>MCP</small></span>
    </div>
    <nav class="nav" id="nav">
      <a href="#/overview" data-view="overview">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 13h6V4H4v9Zm0 7h6v-5H4v5Zm10 0h6v-9h-6v9Zm0-16v5h6V4h-6Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
        <span data-i18n="nav_overview"></span>
      </a>
      <a href="#/approvals" data-view="approvals">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 8v4l2.5 2.5M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span data-i18n="nav_approvals"></span>
        <span class="badge" id="nav-badge" hidden></span>
      </a>
      <a href="#/activity" data-view="activity">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M3 12h4l3-8 4 16 3-8h4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span data-i18n="nav_activity"></span>
      </a>
      <a href="#/policy" data-view="policy">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M7 3h7l5 5v13H7V3Zm7 0v5h5M10 13h6M10 17h6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/></svg>
        <span data-i18n="nav_policy"></span>
      </a>
      <a href="#/integrity" data-view="integrity">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M7 11V8a5 5 0 0 1 10 0v3M5 11h14v10H5V11Zm7 4v2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span data-i18n="nav_integrity"></span>
      </a>
    </nav>
    <div class="sidebar-foot">
      <div id="mode-chip" class="chip"></div>
      <div class="home-path mono" id="home"></div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="titles">
        <h1 id="page-title"></h1>
        <p id="page-sub" class="sub"></p>
      </div>
      <div class="top-actions">
        <span class="updated" id="updated"></span>
        <label class="switch" title="">
          <input id="live" type="checkbox" checked>
          <span class="track"><span class="thumb"></span></span>
          <span id="live-label"></span>
        </label>
        <select id="lang" aria-label="Idioma">
          <option value="es">ES</option>
          <option value="en">EN</option>
          <option value="pt">PT</option>
        </select>
        <button id="reload" type="button" class="icon-btn" aria-label="Reload">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </header>

    <div class="content">
      <p id="load-error" class="alert bad" hidden></p>
      <section id="policy-warning" class="alert bad" hidden></section>

      <section class="view" id="view-overview"></section>
      <section class="view" id="view-approvals" hidden></section>
      <section class="view" id="view-activity" hidden>
        <div class="toolbar">
          <div class="search">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="m21 21-4.3-4.3M11 18a7 7 0 1 1 0-14 7 7 0 0 1 0 14Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <input id="f-text" type="search" autocomplete="off">
          </div>
          <div class="segmented" id="f-decision" role="group"></div>
          <select id="f-tool"></select>
          <span id="shown" class="muted"></span>
        </div>
        <div class="card flush">
          <div class="table-wrap">
            <table class="data" id="table">
              <thead><tr>
                <th data-i18n="c_when"></th>
                <th data-i18n="c_action"></th>
                <th data-i18n="c_server"></th>
                <th data-i18n="c_result"></th>
                <th data-i18n="c_rule"></th>
                <th data-i18n="c_verify"></th>
              </tr></thead>
              <tbody></tbody>
            </table>
          </div>
          <div class="empty" id="table-empty" hidden></div>
        </div>
      </section>
      <section class="view" id="view-policy" hidden></section>
      <section class="view" id="view-integrity" hidden></section>
    </div>
  </div>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <header class="drawer-head">
    <div id="drawer-title"></div>
    <button type="button" class="icon-btn" id="drawer-close" aria-label="Close">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
  </header>
  <div class="tabs" id="drawer-tabs"></div>
  <div class="drawer-body" id="drawer-body"></div>
</aside>

<div class="modal-wrap" id="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" id="modal-box"></div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
