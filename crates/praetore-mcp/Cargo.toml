[package]
name = "praetore-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

description = "Local stdio MCP proxy that records signed PRÆTORE evidence for every tools/call (observe) or enforces policy (enforce)."

[[bin]]
name = "praetore-mcp"
path = "src/main.rs"

[lib]
name = "praetore_mcp"
path = "src/lib.rs"

[dependencies]
hex = "0.4.3"
praetore-core = { path = "../praetore-core" }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
time = { version = "0.3", features = ["formatting", "parsing"] }
uuid = { version = "1.18", features = ["v4"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"

[[example]]
name = "fake_server"
