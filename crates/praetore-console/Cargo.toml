[package]
name = "praetore-console"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

description = "Local operator console: a PRÆTORE journal retold in plain language and an approvals inbox signed on this computer."

[dependencies]
axum = "0.8"
ed25519-dalek = "2"
hex = "0.4.3"
praetore-core = { path = "../praetore-core" }
praetore-gateway = { path = "../praetore-gateway" }
praetore-replay-postgres = { path = "../praetore-replay-postgres" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
postgres = { version = "0.19", features = ["with-time-0_3", "with-uuid-1"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
subtle = "2.6"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-normalization = "0.1.26"
unicode-properties = "0.1.4"
uuid = { version = "1.18", features = ["serde"] }

[target.'cfg(unix)'.dependencies]
# Secret files: O_NOFOLLOW and the effective uid for the owner check;
# foreground check for the Enter-for-a-new-link thread.
rustix = { version = "1.1", default-features = false, features = ["std", "fs", "process", "termios"] }
# Ignoring SIGTTIN (rustix has no safe signal disposition API).
libc = "0.2"

[dev-dependencies]
time = { version = "0.3", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
